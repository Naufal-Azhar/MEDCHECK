services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: forgehacks-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-forgehacks}
      POSTGRES_USER: ${POSTGRES_USER:-forgehacks}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-forgehacks_dev}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
